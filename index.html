<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Shoot 'em Up Simple</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #fff; }
    canvas { border: 2px solid #444; background: #000; }
    #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui">Puntuación: <span id="score">0</span> | Vidas: <span id="lives">3</span></div>
  <canvas id="game" width="600" height="800"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const keys = {};
    const keysPressed = {};
    document.addEventListener('keydown', e => {
      if (!keys[e.code]) keysPressed[e.code] = true;
      keys[e.code] = true;
    });
    document.addEventListener('keyup', e => keys[e.code] = false);

    const player = { x: W/2 - 20, y: H - 80, w: 40, h: 40, speed: 6, cooldown: 0 };
    const bullets = [];
    const enemies = [];
    const particles = [];
    let score = 0, lives = 3, spawnTimer = 0, gameOver = false, shake = 0;

    const enemyImg = new Image();
    enemyImg.src = 'assets/images/enemy.png';
    const enemyDeadSound = new Audio('assets/sounds/enemy-dead.ogg');
    const shotSound = new Audio('assets/sounds/shot.mp3');

    function spawnEnemy() {
      const side = Math.random() < 0.5 ? -30 : W + 30;
      const y = Math.random() * (H * 0.6) + 50;
      const speedX = (side < 0 ? 1 : -1) * (1 + Math.random() * 2);
      const speedY = (Math.random() - 0.5) * 2;
      enemies.push({ x: side, y, w: 50, h: 50, vx: speedX, vy: speedY, hp: 1 });
    }

    function update() {
      if (gameOver) return;

      // Player movement
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
      if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
      if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
      player.x = Math.max(0, Math.min(W - player.w, player.x));
      player.y = Math.max(0, Math.min(H - player.h, player.y));

      // Shoot
      if ((keysPressed['Space'] || keysPressed['KeyJ']) && player.cooldown <= 0) {
        bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 15, vy: -10 });
        shotSound.currentTime = 0;
        shotSound.play();
        player.cooldown = 10;
      }
      player.cooldown--;

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy;
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }

      // Enemies
      spawnTimer++;
      if (spawnTimer > 45) { spawnEnemy(); spawnTimer = 0; }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx; e.y += e.vy;
        if (e.y < 50 || e.y > H - 100) e.vy *= -1;
        if (e.x < -50 || e.x > W + 50) { enemies.splice(i, 1); continue; }

        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            e.hp--; bullets.splice(j, 1);
            if (e.hp <= 0) {
              score += 100;
              enemyDeadSound.currentTime = 0;
              enemyDeadSound.play();
              for (let k = 0; k < 8; k++) particles.push({ x: e.x + e.w/2, y: e.y + e.h/2, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 30, color: '#f00' });
              enemies.splice(i, 1);
            }
            break;
          }
        }

        // Player collision
        if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
          lives--; enemies.splice(i, 1);
          shake = 15;
          for (let k = 0; k < 12; k++) particles.push({ x: player.x + player.w/2, y: player.y + player.h/2, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 40, color: '#fff' });
          if (lives <= 0) gameOver = true;
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;

      // Reset keys pressed this frame
      for (const k in keysPressed) keysPressed[k] = false;
    }

    function draw() {
      // Screen shake
      if (shake > 0) {
        ctx.save();
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.9;
      } else {
        shake = 0;
      }

      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

      // Player (triangle ship)
      ctx.fillStyle = '#0f0';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w/2, player.y);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.closePath(); ctx.fill();

      // Bullets
      ctx.fillStyle = '#ff0';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemies (round)
      enemies.forEach(e => {
        const cx = e.x + e.w/2;
        const cy = e.y + e.h/2;
        const r = Math.min(e.w, e.h) / 2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(enemyImg, e.x, e.y, e.w, e.h);
        ctx.restore();
      });

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f00'; ctx.font = '48px monospace'; ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H/2 - 20);
        ctx.font = '24px monospace'; ctx.fillStyle = '#fff';
        ctx.fillText(`Puntuación: ${score}`, W/2, H/2 + 30);
        ctx.fillText('Presiona R para reiniciar', W/2, H/2 + 70);
      }

      if (shake > 0) ctx.restore();
    }

    function loop() {
      update(); draw();
      if (gameOver && keys['KeyR']) { location.reload(); }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
